# Relais public → nginx : X-Forwarded-Proto amont conservé (TLS terminé en amont), sinon schéma local.
map $http_x_forwarded_proto $reveil_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # En-têtes de sécurité de l'interface (locations « / » et « = /index.html » ; /api/ garde ceux de l'API).
    # HSTS : ignoré par les navigateurs sur une réponse HTTP, actif dès que le site est servi en HTTPS.
    # CSP : 'unsafe-inline' pour les styles (styles des composants Angular) ; 'wasm-unsafe-eval' et blob:
    # pour la conversion HEIC (heic-to/csp : WebAssembly dans un Worker).
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob: data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # Les requêtes arrivent sans le préfixe public (ex. /test/reveil/) : /api/... et /...
    location /api/ {
        # Envoi de photos (multipart, jusqu'à 10 fichiers) : aligné sur spring.servlet.multipart.max-request-size.
        client_max_body_size 61m;
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # L'API exige HTTPS (reveil.security.require-https) d'après ce schéma ; ses en-têtes de sécurité sont les siens.
        proxy_set_header X-Forwarded-Proto $reveil_forwarded_proto;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Service worker des notifications (story 14) : toujours revalidé, pour que ses mises à jour soient prises en compte.
    location = /reveil-sw.js {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Routage côté client Angular
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri $uri/ /index.html;
    }
}
