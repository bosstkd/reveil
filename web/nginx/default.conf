server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Les requêtes arrivent sans le préfixe public (ex. /test/reveil/) : /api/... et /...
    location /api/ {
        # Envoi de photos (multipart, jusqu'à 10 fichiers) : aligné sur spring.servlet.multipart.max-request-size.
        client_max_body_size 61m;
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Routage côté client Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
}
