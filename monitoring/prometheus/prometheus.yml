# Collecte des métriques de l'API Reveil (story 15). Port de gestion interne de l'API (MANAGEMENT_SERVER_PORT=8082),
# jamais relayé par nginx : /actuator/prometheus y est accessible sans jeton.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: reveil-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8082"]
