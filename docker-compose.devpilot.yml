# Environnement de test DevPilot : MongoDB + API Java + interface web (nginx, port 8080).
# L'application est servie sous /test/reveil/ ; le préfixe est retiré avant d'arriver à "web".
services:
  mongo:
    # 4.4 : dernière série MongoDB ne nécessitant pas de CPU AVX.
    image: mongo:4.4
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/reveil
      # Secret de signature des jetons : à fournir par l'environnement (>= 32 octets).
      # Vide => clé éphémère générée au démarrage (sessions perdues au redémarrage).
      REVEIL_JWT_SECRET: ${REVEIL_JWT_SECRET:-}
      # Notifications push (FCM HTTP v1) : identifiant du projet Firebase et contenu JSON du compte de service,
      # fournis par l'environnement. Vides => les rappels sont planifiés normalement mais seulement journalisés.
      REVEIL_FCM_PROJECT_ID: ${REVEIL_FCM_PROJECT_ID:-}
      REVEIL_FCM_CREDENTIALS_JSON: ${REVEIL_FCM_CREDENTIALS_JSON:-}
      # Notifications du navigateur (Web Push, VAPID) : paire de clés base64url fournie par l'environnement.
      # Vides => paire générée au premier besoin et conservée dans MongoDB (volume mongo-data).
      REVEIL_WEBPUSH_PUBLIC_KEY: ${REVEIL_WEBPUSH_PUBLIC_KEY:-}
      REVEIL_WEBPUSH_PRIVATE_KEY: ${REVEIL_WEBPUSH_PRIVATE_KEY:-}
      REVEIL_WEBPUSH_SUBJECT: ${REVEIL_WEBPUSH_SUBJECT:-mailto:no-reply@reveil.local}
      # HTTPS exigé par l'API (403 en clair) d'après X-Forwarded-Proto relayé par "web". Le TLS de cet
      # environnement est terminé en amont, hors de nos conteneurs : désactivé par défaut ici, à activer
      # (true) quand le relais public transmet « X-Forwarded-Proto: https ».
      REVEIL_REQUIRE_HTTPS: ${REVEIL_REQUIRE_HTTPS:-false}
      # Mot de passe oublié : adresse publique de l'interface (base du lien envoyé par e-mail).
      REVEIL_PUBLIC_URL: ${REVEIL_PUBLIC_URL:-http://localhost:8080/test/reveil}
      # Serveur SMTP fourni par l'environnement (identifiants jamais dans le dépôt). Hôte vide => e-mails non
      # envoyés, seulement journalisés ; ici leur contenu (lien de réinitialisation) l'est aussi, pour les tests.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      REVEIL_MAIL_FROM: ${REVEIL_MAIL_FROM:-Reveil <no-reply@reveil.local>}
      REVEIL_MAIL_LOG_CONTENT: ${REVEIL_MAIL_LOG_CONTENT:-true}
      # Supervision (story 15) : port de gestion interne (métriques Prometheus, /actuator/reminders, santé), jamais
      # relayé par "web". Journaux JSON (ECS) : chaque envoi de rappel avec son statut. E-mail d'alerte facultatif.
      MANAGEMENT_SERVER_PORT: "8082"
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      REVEIL_ALERT_EMAIL: ${REVEIL_ALERT_EMAIL:-}
    expose:
      - "8081"
      - "8082"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        BASE_HREF: /test/reveil/
    expose:
      - "8080"
    depends_on:
      - api
    restart: unless-stopped

  # Supervision des rappels (story 15) : collecte de api:8082 et règle d'alerte (taux d'échec > 5 % sur 1 h).
  prometheus:
    build:
      context: .
      dockerfile: Dockerfile
      target: prometheus
    volumes:
      - prometheus-data:/prometheus
    expose:
      - "9090"
    depends_on:
      - api
    restart: unless-stopped

  # Tableau de bord « Reveil — Envoi des rappels » (provisionné), consultation anonyme en lecture seule.
  grafana:
    build:
      context: .
      dockerfile: Dockerfile
      target: grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/reveil-rappels.json
    volumes:
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mongo-data:
  prometheus-data:
  grafana-data:
