# Environnement de test DevPilot : MongoDB + API Java + interface web (nginx, port 8080).
# L'application est servie sous /test/reveil/ ; le préfixe est retiré avant d'arriver à "web".
services:
  mongo:
    # 4.4 : dernière série MongoDB ne nécessitant pas de CPU AVX.
    image: mongo:4.4
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/reveil
      # Secret de signature des jetons : à fournir par l'environnement (>= 32 octets).
      # Vide => clé éphémère générée au démarrage (sessions perdues au redémarrage).
      REVEIL_JWT_SECRET: ${REVEIL_JWT_SECRET:-}
      # Notifications push (FCM HTTP v1) : identifiant du projet Firebase et contenu JSON du compte de service,
      # fournis par l'environnement. Vides => les rappels sont planifiés normalement mais seulement journalisés.
      REVEIL_FCM_PROJECT_ID: ${REVEIL_FCM_PROJECT_ID:-}
      REVEIL_FCM_CREDENTIALS_JSON: ${REVEIL_FCM_CREDENTIALS_JSON:-}
      # HTTPS exigé par l'API (403 en clair) d'après X-Forwarded-Proto relayé par "web". Le TLS de cet
      # environnement est terminé en amont, hors de nos conteneurs : désactivé par défaut ici, à activer
      # (true) quand le relais public transmet « X-Forwarded-Proto: https ».
      REVEIL_REQUIRE_HTTPS: ${REVEIL_REQUIRE_HTTPS:-false}
      # Mot de passe oublié : adresse publique de l'interface (base du lien envoyé par e-mail).
      REVEIL_PUBLIC_URL: ${REVEIL_PUBLIC_URL:-http://localhost:8080/test/reveil}
      # Serveur SMTP fourni par l'environnement (identifiants jamais dans le dépôt). Hôte vide => e-mails non
      # envoyés, seulement journalisés ; ici leur contenu (lien de réinitialisation) l'est aussi, pour les tests.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      REVEIL_MAIL_FROM: ${REVEIL_MAIL_FROM:-Reveil <no-reply@reveil.local>}
      REVEIL_MAIL_LOG_CONTENT: ${REVEIL_MAIL_LOG_CONTENT:-true}
    expose:
      - "8081"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        BASE_HREF: /test/reveil/
    expose:
      - "8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo-data:
