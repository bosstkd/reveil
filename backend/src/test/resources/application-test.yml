de:
  flapdoodle:
    mongodb:
      embedded:
        # 4.4 : même version que docker-compose.devpilot.yml (dernière série sans exigence CPU AVX).
        # Surcharger via EMBEDDED_MONGO_VERSION (ex. 7.0.14) si besoin.
        version: ${EMBEDDED_MONGO_VERSION:4.4.29}
reveil:
  reminders:
    # Les tests déclenchent eux-mêmes le traitement des rappels.
    scheduler-enabled: false
  accounts:
    # Les tests déclenchent eux-mêmes la passe de purge (AccountService.purgePending()).
    purge-scheduler-enabled: false
